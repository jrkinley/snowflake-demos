# env.yml has no equivalent in OSS dbt. Snowflake resolves these values before
# dbt starts, so the right-hand side can be SQL that runs in the session context
# of whoever called EXECUTE DBT PROJECT.
#
# Naming is enforced, not stylistic: every key must be UPPERCASE and DBT_-prefixed,
# or the run fails. Secrets go in a separate secrets: block backed by Snowflake
# SECRET objects, never as plain values here.
env_config:
  default_environment: dev
  environments:

    # Per-developer isolation is still available by swapping DEV for CURRENT_USER(),
    # but a named DEV schema is easier to reason about with one engineer.
    - name: dev
      env:
        DBT_CURRENT_ROLE: "{{ select CURRENT_ROLE() }}"
        DBT_CURRENT_WH: "{{ select CURRENT_WAREHOUSE() }}"
        DBT_CURRENT_SCHEMA: "DEV"
        DBT_CURRENT_DB: "IMF_DBT_DB"

    # Role and warehouse still follow the caller so a task and its profile cannot
    # wake two different warehouses.
    - name: prod
      env:
        DBT_CURRENT_ROLE: "{{ select CURRENT_ROLE() }}"
        DBT_CURRENT_WH: "{{ select CURRENT_WAREHOUSE() }}"
        DBT_CURRENT_SCHEMA: "PROD"
        DBT_CURRENT_DB: "IMF_DBT_DB"
